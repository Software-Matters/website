# /etc/nginx/sites-available/swmatters  (symlink into sites-enabled)
# Certbot (`certbot --nginx -d swmatters.com -d www.swmatters.com`) will add the
# HTTPS listeners/certs and the http->https redirect to this file.

# Rate limit for the contact form: ~5 requests/minute per IP (this line must be at http level;
# files in sites-enabled are included inside http {}, so it's fine here).
limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;

# www -> bare domain
server {
    listen 80;
    listen [::]:80;
    server_name www.swmatters.com;
    return 301 $scheme://swmatters.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name swmatters.com;

    # The git checkout lives here. It also holds .env, the Python code, data/ and .git,
    # so nginx serves ONLY index.html from it; every other path is a 404.
    root /var/www/swmatters;

    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
    }

    location = /api/contact {
        limit_req zone=contact burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anything else (/.env, /app.py, /.git/..., /data/...) -> 404
    location / {
        return 404;
    }
}
